function renderCart(){$('count').textContent=cart.length;let total=0;const counts=new Map();cart.forEach(id=>counts.set(String(id),(counts.get(String(id))||0)+1));$('cartItems').innerHTML=counts.size?[...counts].map(([id,qty])=>{const p=products.find(x=>String(x.id)===id);if(!p)return '';const subtotal=qty*Number(p.price_egp||0);total+=subtotal;return `<div class="cartrow row"><div><strong>${safe(p.name)}</strong><p class="muted small">${money(p.price_egp)} × ${qty} = ${money(subtotal)}</p></div><div class="cart-controls"><button data-cart-minus="${safe(id)}" aria-label="Decrease">−</button><strong>${qty}</strong><button data-cart-plus="${safe(id)}" aria-label="Increase" ${qty>=Number(p.stock||0)?'disabled':''}>+</button><button data-cart-delete="${safe(id)}">${t('remove')}</button></div></div>`}).join(''):`<p class="muted">${t('emptyCart')}</p>`;$('cartTotal').textContent=t('total')+': '+money(total);renderInvoice()}

function orderLines(){const counts=new Map();for(const id of cart)counts.set(String(id),(counts.get(String(id))||0)+1);return [...counts].map(([id,quantity])=>({product_id:id,quantity}));}
function cartSubtotal(){return orderLines().reduce((sum,line)=>{const p=products.find(x=>String(x.id)===line.product_id);return sum+(p?Number(p.price_egp||0)*line.quantity:0)},0)}
function selectedShipping(){const g=$('customerGovernorate').value;return Object.prototype.hasOwnProperty.call(shippingRates,g)?shippingRates[g]:null}
function paymentMethod(){return document.querySelector('input[name="payment"]:checked')?.value||'cod'}
function renderInvoice(){if(!$('invoiceDetails'))return;const subtotal=cartSubtotal(),rate=selectedShipping(),g=$('customerGovernorate').value;$('invoiceDetails').innerHTML=`<div class="row"><span>${t('subtotal')}</span><b>${money(subtotal)}</b></div><div class="row"><span>${t('shipping')}${g?' — '+safe(lang==='ar'?g:govEn[governorates.indexOf(g)]||g):''}</span><b>${rate===null?'—':money(rate)}</b></div><div class="row"><strong>${t('total')}</strong><strong>${rate===null?'—':money(subtotal+rate)}</strong></div>`;$('shippingWarning').textContent=!g?t('chooseGov'):rate===null?t('shippingUnavailable'):'';updatePaymentBox();updateCheckoutButton()}
function updatePaymentBox(){if(!$('vodafoneBox'))return;const isCash=paymentMethod()==='vodafone';$('vodafoneBox').classList.toggle('hidden',!isCash);$('vodafoneNumber').textContent=cashNumber;const fee=selectedShipping();$('vodafoneAmount').textContent=fee===null?'':t('total')+': '+money(cartSubtotal()+fee)}
function updateCheckoutButton(){if(!$('placeOrderBtn'))return;const btn=$('placeOrderBtn');btn.disabled=orderBusy||!shippingReady||!cart.length||selectedShipping()===null||!currentUser;btn.textContent=!currentUser?t('signInFirst'):!shippingReady?t('shippingSetup'):t('placeOrder')}
async function loadCheckoutSettings(){shippingReady=false;try{const [r,p]=await Promise.all([db.from('dripx_shipping_rates').select('governorate,price_egp'),db.from('dripx_payment_settings').select('vodafone_number').eq('id',1).maybeSingle()]);if(r.error)throw r.error;if(p.error)throw p.error;shippingRates={};for(const row of r.data||[])if(row.price_egp!==null)shippingRates[row.governorate]=Number(row.price_egp);cashNumber=p.data?.vodafone_number||'01042040012';shippingReady=true;$('checkoutNote').textContent=t('checkoutNote')}catch(e){$('checkoutNote').textContent=t('shippingSetup')+' — '+e.message}renderInvoice()}
async function placeOrder(){if(orderBusy||!db||!currentUser)return;const fields={customer_name:$('customerName').value.trim(),customer_phone:$('customerPhone').value.trim(),governorate:$('customerGovernorate').value,city:$('customerCity').value.trim(),address:$('customerAddress').value.trim(),notes:$('customerNotes').value.trim()};if(!fields.customer_name||!/^01[0125][0-9]{8}$/.test(fields.customer_phone)||!fields.governorate||!fields.city||!fields.address){$('orderFeedback').textContent=t('fillDelivery')+' (01xxxxxxxxx)';return}if(!cart.length||selectedShipping()===null)return;orderBusy=true;updateCheckoutButton();$('orderFeedback').textContent=t('working');$('orderSuccess').classList.add('hidden');try{const {data,error}=await db.rpc('dripx_place_order',{p_lines:orderLines(),p_customer:fields,p_payment_method:paymentMethod()});if(error)throw error;const order=data;const number=String(order.order_number||order.id),total=Number(order.total_egp),cash=paymentMethod()==='vodafone';$('orderFeedback').textContent=t('orderPlaced')+' #'+number+' — '+money(total);const msg=`DRIP X 🖤\nOrder: ${number}\nProducts: ${order.subtotal_egp} EGP\nShipping: ${order.shipping_egp} EGP\nTotal: ${total} EGP\nVodafone Cash: ${cashNumber}\nI will send the payment screenshot in the next message.`;const wa='https://wa.me/2'+cashNumber.replace(/\D/g,'').replace(/^0/,'')+'?text='+encodeURIComponent(msg);$('orderSuccess').innerHTML=cash?`<p>${safe(t('cashPending'))}</p><a class="primary" style="display:inline-block;padding:12px;color:white;border-radius:10px;text-decoration:none" href="${wa}" target="_blank" rel="noopener">📲 ${t('sendWhatsapp')}</a><p class="small muted">${lang==='ar'?'افتح واتساب وأرفق صورة التحويل بنفسك، ولن يعتبر الطلب مدفوعًا حتى تتم المراجعة.':'Open WhatsApp and attach your screenshot manually. Payment is not confirmed until reviewed.'}</p>`:`<p>${safe(t('codPending'))} — #${safe(number)}</p>`;$('orderSuccess').classList.remove('hidden');cart=[];persistCart();await loadProducts()}catch(e){$('orderFeedback').textContent=t('orderFailed')+': '+e.message}finally{orderBusy=false;renderCart();updateCheckoutButton()}}
$('customerGovernorate').addEventListener('change',renderInvoice);document.querySelectorAll('input[name="payment"]').forEach(el=>el.addEventListener('change',updatePaymentBox));$('copyCash').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(cashNumber);$('copyCash').textContent='✓'}catch{prompt('Copy:',cashNumber)}});$('placeOrderBtn').addEventListener('click',placeOrder);

function accountStatus(msg,error=false){$('accountStatus').textContent=msg;$('accountStatus').className=error?'error':'muted'}
async function loadProducts(){if(!db)return;$('productsMessage').textContent=t('loading');const {data,error}=await db.from('products').select('*');if(error){$('productsMessage').textContent=t('loadError')+': '+error.message;return}products=(data||[]).sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));renderProducts();renderCart();renderAdminProducts()}
async function refreshUser(){if(!db)return;const {data,error}=await db.auth.getUser();if(error){accountStatus(error.message,true);return}currentUser=data?.user||null;$('authForm').classList.toggle('hidden',!!currentUser);$('signOutBtn').classList.toggle('hidden',!currentUser);accountStatus(currentUser?t('signed')+': '+currentUser.email:t('guest'));await checkAdmin();updateCheckoutButton()}
async function checkAdmin(){isAdmin=false;if(currentUser){const {data,error}=await db.from('store_admins').select('user_id').eq('user_id',currentUser.id).limit(1);if(!error&&data?.length)isAdmin=true;else if(error)$('adminStatus').textContent=t('loadAdminError')+': '+error.message}$('adminNav').classList.toggle('hidden',!isAdmin);$('adminContent').classList.toggle('hidden',!isAdmin);if(!$('adminStatus').textContent.includes(':'))$('adminStatus').textContent=t(isAdmin?'yesAdmin':'noAdmin');if(!isAdmin&&!$('admin').classList.contains('hidden'))show('home');renderAdminProducts()}
async function signIn(){if(!db)return accountStatus(t('noConnection'),true);const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||!password)return accountStatus(t('badAuth'),true);accountStatus(t('working'));const {error}=await db.auth.signInWithPassword({email,password});if(error)return accountStatus(error.message,true);await refreshUser()}
async function signUp(){if(!db)return accountStatus(t('noConnection'),true);const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email.includes('@')||password.length<8)return accountStatus(t('badAuth'),true);accountStatus(t('working'));const {error}=await db.auth.signUp({email,password});if(error)return accountStatus(error.message,true);accountStatus(t('signupDone'));await refreshUser()}
async function signOut(){if(!db)return;const {error}=await db.auth.signOut();if(error)return accountStatus(error.message,true);currentUser=null;await refreshUser()}
function renderAdminProducts(){if(!isAdmin)return;$('adminProducts').innerHTML=products.length?products.map(p=>`<div class="cartrow row"><span>${safe(p.name)} — ${money(p.price_egp)} — ${t(published(p)?'published':'hidden')}</span><div><button data-edit="${safe(p.id)}">${t('edit')}</button> <button data-delete="${safe(p.id)}">${t('delete')}</button></div></div>`).join(''):`<p class="muted">${t('noProducts')}</p>`}
function resetEditor(){editingId=null;['newName','newDescription','newPrice','newImage'].forEach(id=>$(id).value='');$('newStock').value='10';$('newCategory').value='Men Accessories';$('cancelEditBtn').classList.add('hidden');$('formTitle').textContent=t('addProduct')}
function editProduct(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;editingId=id;$('newName').value=p.name||'';$('newDescription').value=p.description||'';$('newCategory').value=p.category||'Men Accessories';$('newPrice').value=p.price_egp??'';$('newStock').value=p.stock??0;$('newImage').value=p.image_url||'';$('formTitle').textContent=t('editProduct');$('cancelEditBtn').classList.remove('hidden');$('formTitle').scrollIntoView({behavior:'smooth'})}
async function saveProduct(){if(!db||!isAdmin)return;const name=$('newName').value.trim(),rawPrice=$('newPrice').value.trim(),rawStock=$('newStock').value.trim(),price=Number(rawPrice),stock=Number(rawStock),image=$('newImage').value.trim();if(!name||!rawPrice||!rawStock||!Number.isFinite(price)||price<0||!Number.isInteger(stock)||stock<0)return $('adminMessage').textContent=t('required');if(image&&!/^https:\/\//i.test(image))return $('adminMessage').textContent=t('badImage');const row={name,description:$('newDescription').value.trim(),category:$('newCategory').value,price_egp:price,stock,image_url:image||null};$('saveProductBtn').disabled=true;let result;if(editingId){result=await db.from('products').update(row).eq('id',editingId)}else{result=await db.from('products').insert({...row,active:true,is_active:true})}$('saveProductBtn').disabled=false;$('adminMessage').textContent=result.error?result.error.message:t('saved');$('adminMessage').className=result.error?'error':'success';if(!result.error){resetEditor();await loadProducts()}}
async function deleteProduct(id){if(!isAdmin||!confirm(t('confirmDelete')))return;const {error}=await db.from('products').delete().eq('id',id);$('adminMessage').textContent=error?error.message:t('deleted');if(!error)await loadProducts()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){show(b.dataset.page);return}if(b.dataset.plus!==undefined||b.dataset.minus!==undefined){const id=b.dataset.plus??b.dataset.minus,p=products.find(x=>String(x.id)===id);if(!p)return;const stock=Number(p.stock)||0,old=selectedQty[id]||1;selectedQty[id]=b.dataset.plus!==undefined?Math.min(stock,old+1):Math.max(1,old-1);document.querySelectorAll('[data-qty]').forEach(el=>{if(el.dataset.qty===id){el.textContent=selectedQty[id];const box=el.closest('.quantity-box');box.querySelector('[data-minus]').disabled=selectedQty[id]<=1;box.querySelector('[data-plus]').disabled=selectedQty[id]>=stock}});return}if(b.dataset.add){addCart(b.dataset.add);return}if(b.dataset.cartPlus!==undefined){changeCartQty(b.dataset.cartPlus,1);return}if(b.dataset.cartMinus!==undefined){changeCartQty(b.dataset.cartMinus,-1);return}if(b.dataset.cartDelete!==undefined){cart=cart.filter(x=>String(x)!==b.dataset.cartDelete);persistCart();renderCart();return}if(b.dataset.edit){editProduct(b.dataset.edit);return}if(b.dataset.delete){deleteProduct(b.dataset.delete)}});
function updatePasswordEye(){const visible=$('authPassword').type==='text',btn=$('togglePassword');btn.setAttribute('aria-pressed',String(visible));const label=lang==='ar'?(visible?'إخفاء كلمة المرور':'إظهار كلمة المرور'):(visible?'Hide password':'Show password');btn.setAttribute('aria-label',label);btn.title=label;btn.innerHTML=visible?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A11.3 11.3 0 0 1 12 5c6.5 0 10 7 10 7a16.4 16.4 0 0 1-3.3 4.1M6.2 6.3C3.5 8.1 2 12 2 12s3.5 7 10 7a10.9 10.9 0 0 0 4.5-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>'} $('togglePassword').addEventListener('click',()=>{$('authPassword').type=$('authPassword').type==='password'?'text':'password';updatePasswordEye()});$('langBtn').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('dripx_lang',lang);applyLang();updatePasswordEye()});$('signInBtn').addEventListener('click',signIn);$('signUpBtn').addEventListener('click',signUp);$('signOutBtn').addEventListener('click',signOut);$('saveProductBtn').addEventListener('click',saveProduct);$('cancelEditBtn').addEventListener('click',resetEditor);
async function init(){applyLang();updatePasswordEye();accountStatus(t('checking'));if(!window.supabase?.createClient)return accountStatus(t('noConnection')+' (Supabase library did not load)',true);try{db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);await Promise.all([refreshUser(),loadProducts(),loadCheckoutSettings()]);db.auth.onAuthStateChange(()=>setTimeout(()=>refreshUser().catch(console.error),0))}catch(e){accountStatus(t('noConnection')+': '+e.message,true)}}init();
</script></body></html>
